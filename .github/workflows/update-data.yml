name: Update Red Sox data

on:
  schedule:
    # Primary schedule lives in the Cloudflare sl-scheduler (7:05 AM full / PM news ET). This is a sparse daily backup.
    - cron: "7 14 * * *"   # ~10 AM ET backup full refresh
  workflow_dispatch:
    inputs:
      mode:
        description: "full or news"
        default: "full"

permissions: {}   # least privilege by default; write scope granted per job below

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: python -m pip install --disable-pip-version-check -q -r requirements.txt
      - name: Fetch data
        env:
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '7 23 * * *' && 'news') || 'full' }}
        run: python scripts/fetch_data.py
      - name: Contract cross-checks
        env:
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '7 23 * * *' && 'news') || 'full' }}
        run: python scripts/contract_checks.py
      - name: Season guard (current season from date + same-day live roster check)
        continue-on-error: true
        run: python scripts/season_guard.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898475+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Update data $(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z')"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
