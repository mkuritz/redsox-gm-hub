name: Update Red Sox data

on:
  schedule:
    - cron: "7 11 * * *"    # ~7:00 AM ET (6 AM during EST): full refresh
    - cron: "7 23 * * *"    # ~7:00 PM ET: evening news/rumors/transactions refresh
  workflow_dispatch:
    inputs:
      mode:
        description: "full or news"
        default: "full"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch data
        env:
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '7 23 * * *' && 'news') || 'full' }}
        run: python scripts/fetch_data.py
      - name: Contract cross-checks
        env:
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '7 23 * * *' && 'news') || 'full' }}
        run: python scripts/contract_checks.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898475+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Update data $(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z')"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
